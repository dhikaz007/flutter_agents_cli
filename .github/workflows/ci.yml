name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CLI
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  dynamic-rules-smoke:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - go_router_get_it
          - flutter_modular_v5
          - flutter_modular_v6
          - flutter_modular_v7
    steps:
      - name: Check out CLI
        uses: actions/checkout@v5

      - name: Check out Dynamic Rules
        uses: actions/checkout@v5
        with:
          repository: dhikaz007/vibe_coding_rules_dynamic
          path: vibe_coding_rules_dynamic

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Validate and apply profile
        env:
          FLUTTER_AGENTS_HOME: ${{ runner.temp }}/flutter-agents
          PROFILE: ${{ matrix.profile }}
        run: |
          dart run bin/agents.dart ruleset add vibe-coding-rules "$GITHUB_WORKSPACE/vibe_coding_rules_dynamic"
          dart run bin/agents.dart ruleset validate vibe-coding-rules
          project="$RUNNER_TEMP/profile-smoke-$PROFILE"
          mkdir -p "$project"
          cd "$project"
          dart run "$GITHUB_WORKSPACE/bin/agents.dart" init --yes
          dart run "$GITHUB_WORKSPACE/bin/agents.dart" ruleset use vibe-coding-rules "$PROFILE"
          test -f PROJECT_PROFILE.md
          grep -Fx "profile: $PROFILE" PROJECT_PROFILE.md
          test -f docs/RULES-MAP.md
          test ! -e "docs/dynamic-rules/profiles/$PROFILE/ARCHITECTURE.md"
          dart run "$GITHUB_WORKSPACE/bin/agents.dart" ruleset map --review
